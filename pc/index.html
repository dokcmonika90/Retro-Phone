<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Phone PC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0f14;color:#f4f5f7;font:15px system-ui,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:230px 1fr;height:100vh}.side{background:#171a21;border-right:1px solid #303540;padding:18px}.logo{font-size:24px;font-weight:800}.muted{color:#9ca3af;font-size:13px}nav button{display:block;width:100%;margin:4px 0;padding:11px;border:0;border-radius:8px;background:transparent;color:#ddd;text-align:left;cursor:pointer}nav button.active,nav button:hover{background:#2a2f39;color:#fff}main{padding:24px;overflow:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:15px}h1{margin:0}.card{background:#181b22;border:1px solid #303540;border-radius:12px;padding:16px;margin-bottom:16px}.screen{height:520px;background:#000;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden}.empty{text-align:center;color:#818896}.empty b{display:block;color:#eee;font-size:20px;margin-bottom:7px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}button,.file{border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.primary{background:#fff;color:#111}.secondary{background:#292e38;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}.system{background:#1b1e26;border:1px solid #303540;border-radius:9px;padding:14px}.system b{display:block}.system span{font-size:12px;color:#9ca3af}.search{width:100%;padding:11px;background:#101218;border:1px solid #303540;border-radius:8px;color:#fff;margin-bottom:10px}.rom{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #292d36}.badge{font-size:11px;background:#292e38;border-radius:20px;padding:3px 7px;color:#d2d6de}.hidden{display:none!important}.notice{background:#20242c;padding:11px;border-radius:8px;color:#bbc1ca;margin-top:12px}.ok{color:#9ee6a8}.warn{color:#ffd28a}@media(max-width:700px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #303540}.side nav{display:flex;overflow:auto}.side nav button{width:auto;min-width:max-content}.screen{height:360px}}
</style></head>
<body><div class="app"><aside class="side"><div class="logo">Retro Phone</div><div class="muted">PC Multi-Console Runner</div><nav><button class="active" data-page="play">🎮 Play</button><button data-page="library">📚 Library</button><button data-page="systems">🕹 Systems</button></nav></aside><main>
<section id="play"><header><div><h1>Game Runner</h1><div id="current" class="muted">No game loaded</div></div><label class="file primary" for="rom">Open ROM</label><input id="rom" type="file" hidden multiple></header><div class="card"><div id="screen" class="screen"><div class="empty"><b>Retro Phone</b>Open a legally obtained ROM to start.</div></div><div class="actions"><button id="pause" class="secondary">Pause</button><button id="reset" class="secondary">Reset</button><button id="full" class="secondary">Fullscreen</button></div><div id="romInfo" class="notice">ROMs are stored locally in your browser so Library games can be launched again.</div></div></section>
<section id="library" class="hidden"><header><div><h1>ROM Library</h1><div class="muted">Locally stored games</div></div></header><div class="card"><input id="search" class="search" placeholder="Search games or systems"><div id="list"></div></div></section>
<section id="systems" class="hidden"><header><div><h1>Systems &amp; Formats</h1><div class="muted">Supported formats and matching emulator cores</div></div></header><div class="card"><div id="systemsGrid" class="grid"></div></div></section>
</main></div>
<script>
const DATA='https://cdn.emulatorjs.org/latest/data/';
const systems=[
['NES / Famicom','nes','nes','.nes,.fds,.unf,.unif,.nez'],['SNES / Super Famicom','snes','snes9x','.sfc,.smc,.fig,.swc,.bs'],['Game Boy','gb','gambatte','.gb,.dmg'],['Game Boy Color','gbc','gambatte','.gbc'],['Game Boy Advance','gba','mgba','.gba'],['Nintendo 64','n64','mupen64plus_next','.n64,.z64,.v64'],['Nintendo DS','nds','melonds','.nds'],['Virtual Boy','vb','beetle_vb','.vb'],['Master System','segaMS','smsplus','.sms,.sg'],['Game Gear','segaGG','genesis_plus_gx','.gg'],['Genesis / Mega Drive','segaMD','genesis_plus_gx','.gen,.md,.smd,.bin'],['Sega 32X','sega32x','picodrive','.32x'],['Sega CD','segaCD','genesis_plus_gx','.cue,.bin,.iso,.chd,.m3u'],['Sega Saturn','segaSaturn','yabause','.cue,.bin,.iso,.chd,.m3u'],['PlayStation','psx','pcsx_rearmed','.cue,.bin,.iso,.img,.chd,.pbp,.m3u'],['PSP','psp','ppsspp','.iso,.cso,.chd,.pbp'],['Atari 2600','atari2600','stella2014','.a26,.bin,.rom'],['Atari 5200','a5200','a5200','.a52,.bin,.rom'],['Atari 7800','atari7800','prosystem','.a78,.bin,.rom'],['Atari Jaguar','jaguar','virtualjaguar','.j64,.jag,.rom,.bin'],['Atari Lynx','lynx','handy','.lnx'],['3DO','3do','opera','.iso,.cue,.bin,.chd'],['PC Engine','pce','mednafen_pce','.pce,.cue,.ccd,.iso'],['PC-FX','pcfx','mednafen_pcfx','.cue,.ccd,.iso,.chd'],['Neo Geo Pocket','ngp','mednafen_ngp','.ngp,.ngc'],['WonderSwan','ws','mednafen_wswan','.ws,.wsc'],['ColecoVision','coleco','gearcoleco','.col,.rom,.bin'],['Commodore 64','c64','vice_x64sc','.d64,.g64,.t64,.prg,.crt,.tap,.x64'],['Amiga','amiga','puae','.adf,.adz,.dms,.fdi,.ipf,.hdf,.uae'],['DOS','dos','dosbox_pure','.zip,.7z,.img,.ima,.iso,.cue'],['Arcade / MAME','arcade','mame2003','.zip,.7z']];
const mapperNames={0:'NROM',1:'MMC1 / SxROM',2:'UxROM',3:'CNROM',4:'MMC3 / TxROM',5:'MMC5 / ExROM',7:'AxROM',9:'MMC2 / PxROM',10:'MMC4 / FxROM',11:'Color Dreams',13:'CPROM',16:'Bandai',18:'Jaleco SS8806',19:'Namco 163',21:'Konami VRC4',22:'Konami VRC2',23:'Konami VRC2/VRC4',24:'Konami VRC6',25:'Konami VRC4',34:'BNROM / NINA-001',66:'GNROM',69:'SunSoft FME-7',71:'Camerica',78:'Irem 74HC161',87:'Jaleco JF-17'};
const extMap=new Map();systems.forEach(s=>s[3].split(',').forEach(e=>extMap.set(e.slice(1),s)));
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let games=[],current=null,paused=false,romBlob=null;
function show(id){document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==id));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id))}document.querySelectorAll('nav button').forEach(x=>x.onclick=()=>show(x.dataset.page));
function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open('RetroPhoneDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('roms',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function loadGames(){const d=await db();games=await new Promise((res,rej)=>{const q=d.transaction('roms','readonly').objectStore('roms').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});renderList()}
async function putGame(g){const d=await db();return new Promise((res,rej)=>{const q=d.transaction('roms','readwrite').objectStore('roms').put(g);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
async function deleteGame(id){const d=await db();return new Promise((res,rej)=>{const q=d.transaction('roms','readwrite').objectStore('roms').delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
function detect(name){const m=String(name).toLowerCase().match(/\.([a-z0-9]+)$/);return m&&extMap.has(m[1])?extMap.get(m[1]):null}
async function parseNES(buf){const b=new Uint8Array(buf.slice(0,32));if(b.length<16||b[0]!==78||b[1]!==69||b[2]!==83||b[3]!==26)return null;const nes2=(b[7]&12)===8;let mapper=((b[6]>>4)&15)|(b[7]&240),sub=nes2?(b[8]>>4)&15:0,prg=b[4],chr=b[5];if(nes2){const pm=b[9]&15,cm=(b[9]>>4)&15;if(pm!==15)prg+=pm<<8;if(cm!==15)chr+=cm<<8}return{header:nes2?'NES 2.0':'iNES',mapper,submapper:sub,mapperName:mapperNames[mapper]||'Mapper '+mapper,prgUnits:prg,chrUnits:chr,battery:!!(b[6]&2),trainer:!!(b[6]&4)}}
function renderSystems(){const q=$('systemsGrid');q.innerHTML='';systems.forEach(s=>{const d=document.createElement('div');d.className='system';d.innerHTML='<b>'+esc(s[0])+'</b><span>'+esc(s[3])+' • '+esc(s[2])+'</span>';q.appendChild(d)})}
function renderList(){const q=$('list'),t=$('search').value.toLowerCase();q.innerHTML='';const a=games.filter(g=>g.name.toLowerCase().includes(t)||g.system.toLowerCase().includes(t));if(!a.length){q.innerHTML='<div class="muted">No games added.</div>';return}a.forEach(g=>{const d=document.createElement('div');d.className='rom';d.innerHTML='<div><b>'+esc(g.name)+'</b><br><span class="badge">'+esc(g.system)+(g.mapper!=null?' • Mapper '+g.mapper:'')+'</span></div>';const box=document.createElement('div');const b=document.createElement('button');b.className='secondary';b.textContent='Play';b.onclick=()=>launchStored(g);const r=document.createElement('button');r.className='secondary';r.textContent='Remove';r.onclick=async()=>{await deleteGame(g.id);await loadGames()};box.append(b,r);d.appendChild(box);q.appendChild(d)})}$('search').oninput=renderList;
async function launchStored(g){const file=new File([g.data],g.name,{type:'application/octet-stream'});await launch({...g,file})}
$('rom').onchange=async e=>{for(const f of [...e.target.files]){const s=detect(f.name);if(!s){alert('Unsupported ROM format: '+f.name);continue}const data=await f.arrayBuffer();let extra={};if(s[1]==='nes'){const info=await parseNES(data);if(!info){alert('This .nes file does not have a valid iNES/NES 2.0 header.');continue}extra={mapper:info.mapper,submapper:info.submapper,mapperName:info.mapperName,nesHeader:info.header}}const g={id:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),name:f.name,system:s[0],core:s[2],systemId:s[1],data,...extra};await putGame(g);games=games.filter(x=>x.name!==g.name);games.push(g);await launch({...g,file:f})}renderList();e.target.value=''};
function stop(){if(romBlob){URL.revokeObjectURL(romBlob);romBlob=null}$('screen').innerHTML='<div class="empty"><b>Retro Phone</b>Preparing emulator…</div>'}
async function launch(g){current=g;paused=false;$('pause').textContent='Pause';$('current').textContent=g.name+' • '+g.system;show('play');stop();if(g.systemId==='nes'){const info=await parseNES(await g.file.arrayBuffer());if(!info){$('romInfo').innerHTML='<span class="warn">Invalid NES header.</span>';return}$('romInfo').innerHTML='<span class="ok">NES '+info.header+' • Mapper '+info.mapper+' — '+esc(info.mapperName)+'</span> • Submapper '+info.submapper+' • PRG '+info.prgUnits+' × 16 KB • CHR '+info.chrUnits+' × 8 KB';g.core='nes'}else $('romInfo').textContent='Core: '+g.core+' • '+g.system;
romBlob=URL.createObjectURL(g.file);window.EJS_player='#retro-game';window.EJS_core=g.core;window.EJS_gameUrl=romBlob;window.EJS_pathtodata=DATA;window.EJS_gameName=g.name;window.EJS_startOnLoad=true;const host=document.createElement('div');host.id='retro-game';host.style.cssText='width:100%;height:100%;';$('screen').innerHTML='';$('screen').appendChild(host);const old=document.getElementById('ejs-loader');if(old)old.remove();const script=document.createElement('script');script.id='ejs-loader';script.src=DATA+'loader.js';script.onload=()=>{$('romInfo').innerHTML+=' <span class="ok">Emulator core loaded.</span>'};script.onerror=()=>{$('romInfo').innerHTML+='<br><span class="warn">EmulatorJS could not load. If this HTML was opened directly from a file, open it through a local web server.</span>'};document.body.appendChild(script)}
$('pause').onclick=()=>{if(!current)return;paused=!paused;$('pause').textContent=paused?'Resume':'Pause';try{if(window.EJS_emulator){if(paused)window.EJS_emulator.pause();else window.EJS_emulator.play()}}catch(e){}};
$('reset').onclick=()=>{if(current)launch(current)};$('full').onclick=()=>{const e=$('screen');if(document.fullscreenElement)document.exitFullscreen();else e.requestFullscreen?.()};
renderSystems();loadGames().catch(e=>{$('romInfo').innerHTML='<span class="warn">Local ROM storage could not be opened in this browser.</span>'});
</script></body></html>
